plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.firebase.firebase-perf'
    id 'com.google.gms.google-services'
    id 'applovin-quality-service'
}

applovin {
    apiKey "gcyVX2np_6N23XxVZWl_N5eTnUgybgZyIMqdBXeWJG4Rniy3LcTOhMvrRTQLpcMePJw9t1uk4O0X2yHg2RNpE9"
}

android {
    namespace 'com.appyhigh.adsdk'
    compileSdk 35

    defaultConfig {
        applicationId "com.appyhigh.adssdk"
        minSdk 21
        targetSdk 35
        versionCode 21
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation("com.applovin:applovin-sdk:13.0.1")
    implementation project(path: ':adsdk')
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'com.google.android.gms:play-services-ads:23.5.0'
    // Import the BoM for the Firebase platform
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    def pluto = '2.2.2'
    debugImplementation "com.plutolib:pluto:$pluto"
    releaseImplementation "com.plutolib:pluto-no-op:$pluto"
    debugImplementation "com.plutolib.plugins:bundle-core:$pluto"
    releaseImplementation "com.plutolib.plugins:bundle-core-no-op:$pluto"

    // Add the dependency for the Performance Monitoring library
    // When using the BoM, you don't specify versions in Firebase library dependencies
    implementation 'com.google.firebase:firebase-perf-ktx'
}